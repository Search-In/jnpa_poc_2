[project]
name = "jnpa-uc2-services"
version = "0.1.0"
description = "JNPA UC2 Python services — connectors (§6) + AI (§7)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "numpy>=1.26",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
ai = ["lightgbm>=4.5"]

[tool.pytest.ini_options]
testpaths = ["connectors", "ai"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
