# nginx for the JNPA UC2 dashboard.
#  - serves the static Vite build (SPA fallback to index.html)
#  - reverse-proxies /gateway/* → the gateway BFF container, stripping the
#    /gateway prefix (mirrors the Vite dev proxy rewrite in vite.config.ts)

# HTTP Server — Redirects all traffic to HTTPS
server {
    listen 80;
    server_name logistics-two.searchintech.in;

    # Redirect to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl;
    server_name logistics-two.searchintech.in;

    # SSL Certs mounted from host /etc/letsencrypt
    ssl_certificate /etc/letsencrypt/live/logistics-two.searchintech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logistics-two.searchintech.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets — long cache for the content-hashed Vite bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Gateway BFF. The browser calls /gateway/api/... and /gateway/auth/dev-token;
    # we strip the prefix so the gateway sees /api/... and /auth/dev-token.
    location /gateway/ {
        proxy_pass http://gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

        # POC3 API reverse proxy
    location /poc3/ {
        rewrite ^/poc3/(.*)$ /$1 break;

        proxy_pass http://gateway:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # UC-II AI/ML model service (ml/, FastAPI on :8200).
    # The browser calls /ml-api/uc2/webapp/predictions; strip /ml-api and forward
    # to the model container (mirrors the Vite /ml-api proxy in vite.config.ts).
    #
    # This service is NEVER published directly. It is stateless, holds no port
    # data and carries no auth of its own, so it must stay on the private
    # network with nginx as the only way in — the same posture as /poc3 above.
    # `ml` is the compose service name; port 8200 because POC-3 holds 8000.
    #
    # The read timeout is longer than the others on purpose: scoring a page runs
    # the learned dwell and gate-queue models, which is real computation. It is
    # still bounded, so a wedged request fails the panel instead of hanging it.
    location /ml-api/ {
        rewrite ^/ml-api/(.*)$ /$1 break;

        proxy_pass http://ml:8200;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    # NLDS Logistics Data Bank — Manage → Track.
    # Browser calls /ldb/api/ldb/container/search?... ; strip /ldb and forward to
    # the public LDB origin (mirrors the Vite /ldb proxy in vite.config.ts).
    # LDB rejects Origin: logistics-two… with "Invalid CORS request", so rewrite
    # Origin/Referer to ldb.co.in on the upstream hop.
    location /ldb/ {
        rewrite ^/ldb/(.*)$ /$1 break;

        proxy_pass https://ldb.co.in;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host ldb.co.in;
        proxy_set_header Origin https://ldb.co.in;
        proxy_set_header Referer https://ldb.co.in/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 60s;
    }

    # SPA: everything else falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

