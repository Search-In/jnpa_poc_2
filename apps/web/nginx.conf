# nginx for the JNPA UC2 dashboard.
#  - serves the static Vite build (SPA fallback to index.html)
#  - reverse-proxies /gateway/* → the gateway BFF container, stripping the
#    /gateway prefix (mirrors the Vite dev proxy rewrite in vite.config.ts)
#
# TLS is terminated upstream (this container listens on :80 only). On the single-
# EC2 demo, either put this behind the host nginx/Caddy doing TLS, or front it
# with an ALB / CloudFront that terminates HTTPS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets — long cache for the content-hashed Vite bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Gateway BFF. The browser calls /gateway/api/... and /gateway/auth/dev-token;
    # we strip the prefix so the gateway sees /api/... and /auth/dev-token.
    location /gateway/ {
        proxy_pass http://gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA: everything else falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
