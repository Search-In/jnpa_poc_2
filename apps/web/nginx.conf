# nginx for the JNPA UC2 dashboard.
#  - serves the static Vite build (SPA fallback to index.html)
#  - reverse-proxies /gateway/* → the gateway BFF container, stripping the
#    /gateway prefix (mirrors the Vite dev proxy rewrite in vite.config.ts)

# HTTP Server — Redirects all traffic to HTTPS
server {
    listen 80;
    server_name logistics-two.searchintech.in;

    # Redirect to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl;
    server_name logistics-two.searchintech.in;

    # SSL Certs mounted from host /etc/letsencrypt
    ssl_certificate /etc/letsencrypt/live/logistics-two.searchintech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logistics-two.searchintech.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets — long cache for the content-hashed Vite bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Gateway BFF. The browser calls /gateway/api/... and /gateway/auth/dev-token;
    # we strip the prefix so the gateway sees /api/... and /auth/dev-token.
    location /gateway/ {
        proxy_pass http://gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

        # POC3 API reverse proxy
    location /poc3/ {
        rewrite ^/poc3/(.*)$ /$1 break;

        proxy_pass http://gateway:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # Runtime DNS for the container upstreams below.
    #
    # NOTE: deliberately NOT a static `upstream { server connector-ulip:8100; }`
    # block. nginx resolves such a hostname ONCE at startup and, worse, REFUSES
    # TO START if it does not resolve — so running the stack without connectors
    # would take the whole dashboard down rather than degrade one card. Resolving
    # per request via Docker's embedded DNS means a stopped connector 502s only
    # its own location, which is exactly the behaviour UC2-040 is demonstrating.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # UC2-040: the six connector services (/health /poll /inject-fault /published).
    # The browser calls /connectors/<slug>/…; strip the prefix and forward over the
    # compose network. Mirrors the six Vite dev proxies in vite.config.ts — without
    # this the production build calls a path nginx does not know, falls through to
    # the SPA catch-all, receives index.html, and every card reads SIMULATED
    # forever while the connectors are up and healthy.
    # The path group is REQUIRED, not optional: with a variable in proxy_pass an
    # empty captured path makes nginx forward the ORIGINAL uri — /connectors/ulip
    # and all — which the connector would 404. Every real call carries a path
    # (/health, /poll, /inject-fault, /published); a bare /connectors/ulip simply
    # falls through to the SPA, which is harmless.
    location ~ ^/connectors/(ulip|icegate|tos|fois|eseal|shipline)(/.*)$ {
        set $connector_upstream "connector-$1:8100";
        set $connector_path "$2";
        proxy_pass http://$connector_upstream$connector_path$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # UC2-015: the gate-queue model service. Same gap, same fix — the Gate panel
    # would otherwise badge every forecast HEURISTIC in the deployed build even
    # with the model container running.
    location ~ ^/ai/gate-queue(/.*)$ {
        set $ai_gate_queue_upstream "ai-gate-queue:8200";
        set $ai_gate_queue_path "$1";
        proxy_pass http://$ai_gate_queue_upstream$ai_gate_queue_path$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # NLDS Logistics Data Bank — Manage → Track.
    # Browser calls /ldb/api/ldb/container/search?... ; strip /ldb and forward to
    # the public LDB origin (mirrors the Vite /ldb proxy in vite.config.ts).
    # LDB rejects Origin: logistics-two… with "Invalid CORS request", so rewrite
    # Origin/Referer to ldb.co.in on the upstream hop.
    location /ldb/ {
        rewrite ^/ldb/(.*)$ /$1 break;

        proxy_pass https://ldb.co.in;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host ldb.co.in;
        proxy_set_header Origin https://ldb.co.in;
        proxy_set_header Referer https://ldb.co.in/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 60s;
    }

    # SPA: everything else falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

