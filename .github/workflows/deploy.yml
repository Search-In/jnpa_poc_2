name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch: {}    # ← ADD THIS LINE

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Workspace
        run: pnpm -r build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          # Vite inlines VITE_* at BUILD time (import.meta.env). The root .env is
          # gitignored and absent on the runner, so these must come from repo
          # secrets here — setting them on the server at runtime has no effect.
          # Unset secrets resolve to "" and fall back to the in-app defaults.
          VITE_CARGO_API_BASE: ${{ secrets.VITE_CARGO_API_BASE }}
          VITE_CARGO_API_TOKEN: ${{ secrets.VITE_CARGO_API_TOKEN }}
          # Turns on the sign-in gate. Users authenticate against POC-3's
          # `POST /api/auth/login` with their own DTCCC account, so there are no
          # VITE_CARGO_AUTH_USER / VITE_CARGO_AUTH_PASS secrets any more — those
          # were inlined into the JS bundle and readable by anyone with devtools.
          # Delete both from the repository secrets; nothing reads them now.
          VITE_AUTH_ENABLED: "true"
          # Base adapter mode for the dashboard bundle (UC2-064). This is the ONLY
          # place it can be set: the EC2 .env is read at runtime, and Vite inlines
          # VITE_* at build time here on the runner. Unset resolves to "" and the
          # app falls back to its `mock` default — which is exactly what every
          # deploy so far has shipped, while docker-compose.aws.yml claimed `live`.
          # Cargo/customs/export are unaffected either way; they come from POC-3.
          VITE_DATA_MODE: ${{ vars.VITE_DATA_MODE }}

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Code to EC2 via Rsync
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '**/node_modules' \
            -e "ssh -i ~/.ssh/id_rsa" \
            ./ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ec2-user/jnpa-uc3-poc/

      - name: Deploy Stack using Docker Compose
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /home/ec2-user/jnpa-uc3-poc
            
            # 1. Create a starter .env if it doesn't exist
            if [ ! -f .env ]; then
              echo "Creating initial .env file..."
              cp .env.aws.example .env
              
              # Auto-generate secure random credentials
              DB_PASS="$(openssl rand -hex 16)"
              sed -i "s/change-me-postgres/${DB_PASS}/g" .env
              
              MINIO_PASS="$(openssl rand -hex 24)"
              sed -i "s/change-me-minio/${MINIO_PASS}/g" .env
              
              JWT_SEC="$(openssl rand -hex 32)"
              sed -i "s|^JWT_DEV_SECRET=.*|JWT_DEV_SECRET=${JWT_SEC}|" .env
            fi
            
            # 2. Run docker-compose build and restart the stack
            docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --build
            
            # 3. Clean up unused/dangling Docker build cache to save space
            docker image prune -f
          EOF

